# Custom YOLOv9t visual backbone/neck + YOLOE-26 detection head; v9t is not v9n.
nc: 80
end2end: true
reg_max: 1
head_legacy: false
text_model: mobileclip2:b
backbone:
  - [-1, 1, Conv, [16, 3, 2]]
  - [-1, 1, Conv, [32, 3, 2]]
  - [-1, 1, ELAN1, [32, 32, 16]]
  - [-1, 1, AConv, [64]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [96]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [128]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [-1, 1, SPPELAN, [128, 64]]
head:
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [64, 64, 32, 3]]
  - [-1, 1, AConv, [48]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [96, 96, 48, 3]]
  - [-1, 1, AConv, [64]]
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 1, RepNCSPELAN4, [128, 128, 64, 3]]
  - [[15, 18, 21], 1, YOLOEDetect, [nc, 512, true]]
