# YOLOE-26n feather grounding with directional P2 detail and multipole P5 context.
# Training recipe: BCE classification and a conservative 10% NWD localization blend.
nc: 80
end2end: true
reg_max: 1
text_model: mobileclip2:b
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: shallow P2 detail
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 6: P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA_MultipoleAttention, [1024]] # 10: multi-scale P5 context

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 13: P4 semantic feature

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16: P3 semantic feature

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19: P4/16

  - [16, 1, nn.Upsample, [None, 2, nearest]]
  - [[2, -1], 1, FeatherP2Fusion, []] # identity-initialized shallow-semantic gate
  - [-1, 1, C3k2_StripBlock, [256, True]] # 22: directional P2/4 refinement

  - [[22, 16, 19], 1, YOLOEDetect, [nc, 512, True]]

scale: n
