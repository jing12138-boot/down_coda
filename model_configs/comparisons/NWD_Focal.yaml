# YOLOE-26n for dense feather grounding with P2-P4 outputs.
# Innovations: lightweight P2 branch, gated detail-semantic fusion, and NWD-Focal training (configured by runner).
nc: 80
end2end: true
reg_max: 1
text_model: mobileclip2:b
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]] # P2/4 stem
  - [-1, 2, C3k2, [256, False, 0.25]] # 2: shallow P2 detail
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 2, C3k2, [512, False, 0.25]] # 4: P3/8
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 2, C3k2, [512, True]] # 6: P4/16
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]]
  - [-1, 2, C2PSA, [1024]] # 10: P5/32 context

head:
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 13: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]] # 16: top-down P3

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]] # 19: P4/16

  - [16, 1, nn.Upsample, [None, 2, nearest]]
  - [[2, -1], 1, FeatherP2Fusion, []]
  - [-1, 1, C3k2, [256, True]] # 22: gated P2/4

  - [[22, 16, 19], 1, YOLOEDetect, [nc, 512, True]]

scale: n
